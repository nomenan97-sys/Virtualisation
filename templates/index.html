<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BET261 Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1em;
        }

        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 28px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .result-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: 700;
        }

        .confidence {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .confidence-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            padding: 12px;
            background: #fadbd8;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 BET261 Predictor</h1>
            <p class="subtitle">Prédiction intelligente basée sur l'IA</p>
        </div>

        <form id="predictorForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="team1">Équipe 1</label>
                    <input type="text" id="team1" name="team1" placeholder="Ex: Manchester United" required>
                </div>
                <div class="form-group">
                    <label for="team2">Équipe 2</label>
                    <input type="text" id="team2" name="team2" placeholder="Ex: Liverpool" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="odds1">Cote Équipe 1</label>
                    <input type="number" id="odds1" name="odds1" step="0.01" min="1" placeholder="1.50" required>
                </div>
                <div class="form-group">
                    <label for="odds2">Cote Équipe 2</label>
                    <input type="number" id="odds2" name="odds2" step="0.01" min="1" placeholder="2.50" required>
                </div>
            </div>

            <div class="form-group">
                <label for="betAmount">Montant du pari (€)</label>
                <input type="number" id="betAmount" name="betAmount" step="0.01" min="0" placeholder="100" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-predict">Prédire</button>
                <button type="reset" class="btn-reset">Réinitialiser</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyse en cours...</p>
        </div>

        <div class="result" id="result">
            <div class="result-title">Prédiction</div>
            <div class="result-value" id="prediction">-</div>
            <div class="confidence">
                <div class="confidence-label">Confiance: <span id="confidencePercent">0</span>%</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        document.getElementById('predictorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const team1 = document.getElementById('team1').value;
            const team2 = document.getElementById('team2').value;
            const odds1 = parseFloat(document.getElementById('odds1').value);
            const odds2 = parseFloat(document.getElementById('odds2').value);
            const betAmount = parseFloat(document.getElementById('betAmount').value);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').classList.remove('show');
            document.getElementById('error').classList.remove('show');

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        team1,
                        team2,
                        odds1,
                        odds2,
                        betAmount
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('prediction').textContent = data.prediction;
                    const confidence = Math.round(data.confidence * 100);
                    document.getElementById('confidencePercent').textContent = confidence;
                    document.getElementById('confidenceFill').style.width = confidence + '%';
                    document.getElementById('result').classList.add('show');
                } else {
                    throw new Error(data.message || 'Erreur de prédiction');
                }
            } catch (error) {
                document.getElementById('error').textContent = '❌ Erreur: ' + error.message;
                document.getElementById('error').classList.add('show');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
